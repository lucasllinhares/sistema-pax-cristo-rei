<section class="hero hero-contato">
  <div class="container hero-inner">
    <div class="form-card">
      <h1>Preencha o formulário</h1>
      <form class="contact-form" id="contact-form" novalidate>
        <label class="sr-only" for="f-nome">Nome</label>
        <input id="f-nome" type="text" name="nome" placeholder="Seu nome" autocomplete="name">
        <label class="sr-only" for="f-email">Email</label>
        <input id="f-email" type="email" name="email" placeholder="E-mail" required autocomplete="email">
        <label class="sr-only" for="f-cidade">Cidade</label>
        <input id="f-cidade" type="text" name="cidade" placeholder="Cidade/UF" required>
        <label class="sr-only" for="f-telefone">Telefone</label>
        <input id="f-telefone" type="tel" name="telefone" placeholder="Telefone" required autocomplete="tel">
        <label class="sr-only" for="f-mensagem">Mensagem</label>
        <textarea id="f-mensagem" name="mensagem" rows="4" placeholder="Mensagem"></textarea>
        <!-- Campo-isca: invisível para pessoas, mas um robô que preenche tudo cai nele.
             Se vier preenchido, a mensagem é descartada antes mesmo de ser enviada. -->
        <label class="hp" for="f-honey" aria-hidden="true">Não preencha este campo</label>
        <input id="f-honey" type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="btn-submit">Enviar mensagem</button>
        <p class="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
  {{shape_asym}}
</section>
